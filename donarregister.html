<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeDrop | Register Donor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#e63946,#1d3557);
overflow:hidden;
}

/* Animated Circles Background */
body::before, body::after{
content:'';
position:absolute;
width:300px;
height:300px;
border-radius:50%;
background:rgba(255,255,255,0.1);
animation:move 10s infinite alternate;
}

body::after{
right:0;
bottom:0;
animation-delay:3s;
}

@keyframes move{
from{transform:translateY(0);}
to{transform:translateY(50px);}
}

/* Glass Form */
.container{
position:relative;
width:400px;
padding:40px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
border-radius:20px;
box-shadow:0 8px 32px rgba(0,0,0,0.2);
color:white;
}

.container h2{
text-align:center;
margin-bottom:25px;
}

.input-group{
position:relative;
margin-bottom:25px;
}

.input-group input,
.input-group select{
width:100%;
padding:12px;
border:none;
border-radius:8px;
outline:none;
}

.input-group label{
position:absolute;
top:12px;
left:15px;
color:#555;
font-size:14px;
transition:0.3s;
pointer-events:none;
}

.input-group input:focus + label,
.input-group input:valid + label{
top:-10px;
left:10px;
font-size:12px;
color:white;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:30px;
background:white;
color:#e63946;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ffd166;
}

.success{
margin-top:15px;
text-align:center;
color:#00ffcc;
display:none;
}

.error{
margin-top:10px;
text-align:center;
color:#ffdddd;
display:none;
font-size:14px;
}

a{
display:block;
text-align:center;
margin-top:15px;
color:white;
text-decoration:none;
font-size:14px;
}
</style>
</head>

<body>

<div class="container">
<h2>🩸 Register as Donor</h2>

<form id="donorForm">
<div class="input-group">
<input type="text" required>
<label>Full Name</label>
</div>

<div class="input-group">
<input type="tel" id="mobile" required maxlength="10">
<label>Mobile Number</label>
</div>

<div class="input-group">
<select required>
<option value="">Select Blood Group</option>
<option>A+</option>
<option>B+</option>
<option>O+</option>
<option>AB+</option>
<option>A-</option>
<option>B-</option>
<option>O-</option>
<option>AB-</option>
</select>
</div>

<div class="input-group">
<input type="text" required>
<label>City</label>
</div>

<button type="submit">Register Now</button>

<div class="error" id="errorMsg">
❌ Mobile number must be exactly 10 digits!
</div>

<div class="success" id="successMsg">
✔ Registration Successful!
</div>

</form>

<a href="index.html">⬅ Back to Home</a>

</div>

<script>
document.getElementById("donorForm").addEventListener("submit", function(e){
e.preventDefault();

let mobile = document.getElementById("mobile").value;
let mobilePattern = /^[0-9]{10}$/;

if(!mobilePattern.test(mobile)){
document.getElementById("errorMsg").style.display = "block";
document.getElementById("successMsg").style.display = "none";
}
else{
document.getElementById("errorMsg").style.display = "none";
document.getElementById("successMsg").style.display = "block";
}
});
</script>

</body>
</html>
