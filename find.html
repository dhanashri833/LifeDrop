<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeDrop | Search Blood</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#1d3557,#e63946);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:900px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
padding:30px;
border-radius:20px;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
color:white;
}

h2{
text-align:center;
margin-bottom:20px;
}

.search-box{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
margin-bottom:20px;
}

select,input{
padding:10px;
border:none;
border-radius:8px;
width:200px;
}

button{
padding:10px 20px;
border:none;
border-radius:30px;
background:white;
color:#e63946;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ffd166;
}

.results{
margin-top:20px;
}

.card{
background:white;
color:#333;
padding:15px;
margin:10px 0;
border-radius:10px;
animation:fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

.no-result{
text-align:center;
margin-top:15px;
color:#ffdddd;
display:none;
}

a{
display:block;
text-align:center;
margin-top:20px;
color:white;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
<h2>🩸 Search Blood Donors</h2>

<div class="search-box">
<select id="bloodGroup">
<option value="">Select Blood Group</option>
<option>A+</option>
<option>B+</option>
<option>O+</option>
<option>AB+</option>
<option>A-</option>
<option>B-</option>
<option>O-</option>
<option>AB-</option>
</select>

<input type="text" id="city" placeholder="Enter City">

<button onclick="searchDonor()">Search</button>
</div>

<div class="results" id="results"></div>
<div class="no-result" id="noResult">❌ No Donor Found</div>

<a href="index.html">⬅ Back to Home</a>

</div>

<script>

/* Dummy Donor Data */
const donors = [
{name:"Rahul Sharma", blood:"A+", city:"Karad", mobile:"9876543210"},
{name:"Priya Patil", blood:"B+", city:"Pune", mobile:"9876501234"},
{name:"Amit Verma", blood:"O+", city:"Mumbai", mobile:"9123456789"},
{name:"Sneha Kulkarni", blood:"AB+", city:"Satara", mobile:"9988776655"},
{name:"Rohit Das", blood:"O-", city:"Kolhapur", mobile:"9871234567"}
];

function searchDonor(){
let blood = document.getElementById("bloodGroup").value;
let city = document.getElementById("city").value.trim().toLowerCase();
let resultsDiv = document.getElementById("results");
let noResult = document.getElementById("noResult");

resultsDiv.innerHTML = "";
noResult.style.display = "none";

let filtered = donors.filter(d =>
(blood === "" || d.blood === blood) &&
(city === "" || d.city.toLowerCase() === city)
);

if(filtered.length === 0){
noResult.style.display = "block";
return;
}

filtered.forEach(d => {
resultsDiv.innerHTML += `
<div class="card">
<strong>Name:</strong> ${d.name}<br>
<strong>Blood Group:</strong> ${d.blood}<br>
<strong>City:</strong> ${d.city}<br>
<strong>Mobile:</strong> ${d.mobile}
</div>
`;
});
}

</script>

</body>
</html>
